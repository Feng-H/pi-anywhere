name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Publish with Trusted Publishing
        run: |
          npm config set //registry.npmjs.com/:_authToken=""
          npm publish --access public --provenance --registry=https://registry.npmjs.com/
